<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DREV DS</title>
<meta name="description" content="Digitalt skogskort for drevprøve på dachshund (NKK 2026–2031)">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DREV DS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: én kolonne, mobil først (maks 480px), fast fanelinje nederst. Svart-hvitt med rød viser som eneste aksent. */
:root{
  --bg:#f5f5f3; --surface:#ffffff; --ink:#141414; --muted:#646462; --line:#dcdcd8; --soft:#ececea;
  --red:#d62027; --red-soft:#fbe9e9; --ok:#1f7a3d; --ok-soft:#e6f3ea; --warn:#a15c00; --warn-soft:#fbf0de;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1b1b1b; --ink:#f2f2f0; --muted:#a2a2a0; --line:#323232; --soft:#262626;
  --red:#ff4d4f; --red-soft:#3a1c1c; --ok:#5cc480; --ok-soft:#173022; --warn:#f0b35a; --warn-soft:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1b1b1b; --ink:#f2f2f0; --muted:#a2a2a0; --line:#323232; --soft:#262626;
  --red:#ff4d4f; --red-soft:#3a1c1c; --ok:#5cc480; --ok-soft:#173022; --warn:#f0b35a; --warn-soft:#3a2c14; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.wrap.home{padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top .logo{width:38px;height:38px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line);flex:none}
.top .t{flex:1;min-width:0}
.top .t h1{font-size:1.35rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{color:var(--muted);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px;cursor:pointer;flex:none}
.badge{display:inline-block;font:600 .68rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--soft);color:var(--muted);vertical-align:middle}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.label{font:600 .72rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:52px;padding:0 18px;font:700 1.2rem/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--ink);color:var(--bg);width:100%;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.big{min-height:76px;font-size:1.7rem}
.btn.sm{min-height:44px;font-size:1rem;width:auto;padding:0 14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:is(.btn,.chip,.ep button,.tab,.iconbtn,.navbtn,.linkbtn,select,input,textarea):focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* startside */
.hero{display:flex;align-items:center;gap:14px;padding-block:8px 4px}
.hero img{width:84px;height:84px;border-radius:19px;background:#fff;box-shadow:0 0 0 1px var(--line),0 6px 16px rgba(0,0,0,.12);flex:none}
.hero h1{font-size:2.4rem;line-height:1}
.hero .sub{color:var(--muted);line-height:1.3;margin-top:4px}
.hero .sub span{display:block;font-size:.85rem;letter-spacing:.02em}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;min-height:64px}
.navbtn .m{flex:1;min-width:0}
.navbtn b{font:700 1.3rem/1.1 var(--f-display);display:block}
.navbtn .cnt{font:700 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right}
.navbtn .chev{color:var(--muted);font-size:1.4rem;line-height:1}
.navbtn.quiet{background:transparent;border-style:dashed}
.prove{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;background:none;border:0;padding:0}
.prove img{width:48px;height:48px;border-radius:11px;background:#fff;box-shadow:0 0 0 1px var(--line);flex:none}
.prove .m{flex:1;min-width:0}
.prove b{font-family:var(--f-display);font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prove .pr{font:700 1.1rem/1.1 var(--f-display);text-align:right;flex:none}
.prove .pr small{display:block;font:500 .78rem/1.2 var(--f-body);color:var(--muted)}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard .acts{display:flex;gap:8px;border-top:1px solid var(--soft);padding-top:10px}
.pcard .acts .btn{flex:1}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:.95rem}
/* skjema */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:46px}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.field textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:.92rem;line-height:1.2;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .k{font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px;opacity:.7}
.chip.unk{color:var(--red);border-color:var(--red);font-weight:600}
.chip.unk[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .chip{text-align:center;border-radius:10px;font:700 .95rem/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;min-height:46px}
.check{display:flex;align-items:center;gap:12px;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;cursor:pointer;background:var(--surface)}
.check input{width:24px;height:24px;accent-color:var(--ink);margin:0}
.check span{font-weight:600}
/* tidtaking */
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.clock .v{font:700 1.9rem/1 var(--f-display);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:4px}
.clock .s{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink)}
.tl{display:flex;flex-wrap:wrap;gap:6px}
.tl span{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:4px 9px 5px;background:var(--surface);min-width:62px}
.tl small{font-size:.7rem;color:var(--muted);line-height:1.2;white-space:nowrap}
.tl b{font:700 1.08rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.drev .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.drev .head h2{font-size:1.5rem}
.drevtid{font:700 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.drevtid small{font-size:1.1rem;color:var(--muted);font-weight:600}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ladder div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;line-height:1.2}
.ladder div b{display:block;font:700 1rem/1.1 var(--f-display)}
.ladder div.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.unkline{color:var(--red);font-weight:600;font-size:.88rem}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft)}
.log li:first-child{border-top:0}
.log .n{flex:1;font-weight:500}
.log .d{color:var(--muted);font-size:.85rem}
.log input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 8px;min-height:46px;font-variant-numeric:tabular-nums;width:7.6em;min-width:0}
.alert{border-radius:12px;padding:10px 12px;font-size:.92rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.red{background:var(--red-soft);color:var(--red)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--soft);color:var(--ink);border-left:4px solid var(--ink)}
.alert.info b{display:block}
.linkbtn{background:none;border:0;min-height:48px;padding:10px 16px;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:1rem;font-weight:600;align-self:center}
.locked{opacity:.62}
/* bedømming */
.mom{padding-inline:12px}
.mom h3{font-size:1.25rem;display:flex;gap:8px;align-items:baseline}
.mom h3 .no{color:var(--muted);font-variant-numeric:tabular-nums}
.mom h3 .sc{margin-left:auto;font-size:1.5rem}
.mom h3 .sc.low{color:var(--red)}
.ep{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:10px 0 4px}
.ep button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:64px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.ep button b{font:700 1.5rem/1 var(--f-display)}
.ep button span{font:600 .7rem/1.05 var(--f-display);color:var(--muted);text-align:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.ep button.low b{color:var(--red)}
.ep button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ep button[aria-pressed="true"] span{color:var(--bg)}
.ep button[aria-pressed="true"] b{color:var(--bg)}
.ep button.low[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.ep button.low[aria-pressed="true"] b,.ep button.low[aria-pressed="true"] span{color:#fff}
details.rule{margin-top:12px;font-size:.92rem;border-top:1px solid var(--soft);padding-top:10px}
details.rule summary{cursor:pointer;color:var(--muted);font-weight:600;min-height:32px;display:flex;align-items:center}
ul.rules{list-style:none;margin:4px 0 0;padding:0}
ul.rules li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--soft)}
ul.rules li:first-child{border-top:0}
ul.rules li span{flex:1;min-width:0}
ul.rules li b{flex:none;min-width:2.6em;text-align:center;font:700 1rem/1.3 var(--f-display);border:1px solid var(--line);border-radius:6px;padding:0 6px}
ul.rules li b.low{color:var(--red);border-color:var(--red)}
/* resultat */
.result{text-align:center;padding:20px 14px}
.result .p{font:700 3rem/1 var(--f-display);margin:6px 0}
.tablewrap{overflow-x:auto}
table.ept{width:100%;border-collapse:collapse}
table.ept th{font:600 .7rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 6px 8px}
table.ept th:first-child{text-align:left;padding-left:0}
table.ept td{border-top:1px solid var(--soft);padding:8px 0 8px 8px;vertical-align:middle;text-align:right}
table.ept td:first-child{text-align:left;padding-left:0}
table.ept td .no{display:inline-block;width:1.8em;color:var(--muted);font-variant-numeric:tabular-nums}
table.ept td b{font:700 1.3rem/1 var(--f-display);font-variant-numeric:tabular-nums}
table.ept td small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
table.ept td.low b,table.ept td.low small{color:var(--red)}
table.ept select{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:0 8px;font:700 1.1rem var(--f-display)}
table.ept tfoot td{border-top:2px solid var(--ink);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.checks i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.8rem}
.checks i.y{background:var(--ok-soft);color:var(--ok)}
.checks i.n{background:var(--red-soft);color:var(--red)}
/* dokumenter */
.doc{display:flex;flex-direction:column;gap:10px}
.doc h3{font-size:1.2rem;line-height:1.15}
.doc .acts{display:flex;gap:8px}
.doc .acts > *{flex:1}
.ref dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.ref dt{font-weight:600}
.ref dd{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.ref table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ref td,.ref th{padding:6px 4px;border-top:1px solid var(--soft);text-align:left;font-size:.92rem}
.ref th{font:600 .7rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
/* faner */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:.78rem;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--red)}
.note{font-size:.82rem;color:var(--muted);text-align:center;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.95rem;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>

<div id="app" lang="nb"></div>
<div id="toast" role="status" hidden></div>

function lastTime(p){let m=0;p.slipp.forEach(s=>{Object.values(s.ev).forEach(v=>m=Math.max(m,v));s.tap.forEach(t=>{m=Math.max(m,t.s,t.e||0)})});return m}
const endT=p=>p.status==="pagar"?now(p):lastTime(p);
function tapInfo(s,p){return s.tap.map(t=>{const e=t.e||endT(p);const m=mins(e-t.s);return{...t,m,notert:m>=3,open:!t.e}})}
function tapMin(s,p){return tapInfo(s,p).filter(t=>t.notert).reduce((a,t)=>a+t.m,0)}
function drevtid(s,p){
  if(!s.ev.uttak) return 0;
  const end=s.ev.opph||s.ev.koplet||endT(p);
  return Math.max(0,mins(end-s.ev.uttak)-tapMin(s,p));
}
function tidGrad(s,p){const m=drevtid(s,p),k=krav(s.dyr);return m>=k[1]?3:m>=k[2]?2:m>=k[3]?1:0}
function losSlipp(s,p){return s.ev.slipp?mins((s.ev.koplet||endT(p))-s.ev.slipp):0}
function loestid(p){return p.slipp.reduce((a,s)=>a+losSlipp(s,p),0)}
function provetid(p){const f=p.slipp[0]?.ev.slipp;return f?mins(endT(p)-f):0}
function status(s){
  if(!s.ev.slipp) return "klar";
  if(s.ev.koplet) return "koplet";
  if(s.ev.opph) return "opph";
  if(s.tap.some(t=>!t.e)) return "tap";
  if(s.ev.uttak) return "drev";
  if(s.ev.fot) return "fot";
  return "sok";
}
function poengOf(get){
  const ep=MOM.map(m=>get(m.n)||0);
  const sum=ep.reduce((a,b)=>a+b,0), done=ep.every(x=>x>0);
  const noLow=ep.every(x=>x>2), noLow6710=[6,7,10].every(n=>(get(n)||0)>2);
  let g=0; if(sum>=30)g=1; if(sum>=36)g=2; if(sum>=42&&noLow6710)g=3; if(sum>=52&&noLow)g=4;
  return {ep,sum,done,noLow,noLow6710,g};
}
const poeng=p=>poengOf(n=>p.mom[n]?.ep);
const kpoeng=p=>poengOf(n=>p.kolleg?.ep?.[n]);
function forslag(p){
  const P=poeng(p);
  const tg=p.slipp.reduce((a,s)=>Math.max(a,tidGrad(s,p)),0);
  let g=Math.min(P.g, tg===3?4:tg);
  if(!p.sett) g=0;
  return {P,tg,g};
}

function timeline(s,p){

function drevCard(p,s,i){
  const st=status(s),dt=drevtid(s,p),k=krav(s.dyr),taps=tapInfo(s,p);
  const stTxt={sok:"Søk",fot:"Arbeid på fot",drev:"Drev pågår",tap:"Tap",opph:"Tidtaking opphørt",koplet:"Koplet"}[st];

  let rows=[];
  ev.forEach(([key,l])=>{if(s.ev[key])rows.push({t:s.ev[key],h:`<li><span class="n">${l}</span><input type="time" id="t-${i}-${key}" data-time="${i}|${key}" value="${hm(s.ev[key])}" aria-label="${l} klokkeslett"></li>`})});
  taps.forEach((t,j)=>rows.push({t:t.s,h:`<li><span class="n">Tap ${j+1}<br><span class="d">${t.open?"pågår ·":""} ${t.m} min ${t.notert?"· noteres":"· under 3 min, regnes som drev"}</span></span><input type="time" id="t-${i}-ts${j}" data-time="${i}|ts${j}" value="${hm(t.s)}" aria-label="Tap ${j+1} start">${t.e?`<input type="time" id="t-${i}-te${j}" data-time="${i}|te${j}" value="${hm(t.e)}" aria-label="Tap ${j+1} slutt">`:""}</li>`}));
  rows.sort((a,b)=>a.t-b.t);
  const open=taps.find(t=>t.open);
  let warn="";

    if(open&&open.m>=60) warn='<div class="alert red">Tap på 60 minutter regnes som dødtap. Kopling beordres.</div>';
    else if(open&&open.m>=45) warn=`<div class="alert warn">Tapet har vart ${open.m} min. Dødtap ved 60 min.</div>`;
    if(dt>=k[1]&&!s.ev.opph&&!s.ev.koplet) warn+='<div class="alert ok">Drevtiden kvalifiserer til 1. premie. Hunden skal koples.</div>';
  }
  return `<section class="card drev stack"><div class="head"><h2>Slipp ${i+1}</h2><span class="state"><span class="dot ${live?"live":""}"></span>${stTxt}</span></div>
   <div class="field"><span class="label">Viltart</span><div class="chips">${DYR.map(d=>`<button class="chip ${d==="Ukjent"?"unk":""}" data-dyr="${i}" data-v="${d}" aria-pressed="${s.dyr===d}">${d}</button>`).join("")}</div>
   ${s.dyr==="Ukjent"?'<span class="unkline">Viltart ikke bekreftet. Velg art når drevdyret er sett eller sporet.</span>':""}</div>
   <div><div class="label">Drevtid${s.dyr==="Ukjent"?" (krav som for rev, rådyr og hjort)":""}</div><div class="drevtid">${dt}<small> min</small></div>
   <div class="ladder">${[3,2,1].map(g=>`<div class="${dt>=k[g]?"ok":""}"><b>${g}. premie</b>${k[g]} min</div>`).join("")}</div></div>
   ${warn}<ul class="log">${rows.map(r=>r.h).join("")}</ul></section>`;
}

  y=doc.lastAutoTable.finalY+14;
  if(y>275){doc.addPage();y=30}
  doc.setDrawColor(120);doc.setLineWidth(.3);doc.line(M,y,M+80,y);doc.line(W-M-60,y,W-M,y);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(90);
  doc.text("Dommer: "+(h.dommer||""),M,y+4);doc.text("Dato",W-M-60,y+4);
  const n=doc.getNumberOfPages(),stamp=new Date();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(130);
    doc.text(`DREV DS · laget ${stamp.toLocaleDateString("nb-NO")} kl. ${hm(stamp.getTime())}`,M,290);doc.text(`Side ${i} av ${n}`,W-M,290,{align:"right"})}
  return doc.output("blob");
}
const dlP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
let dl=null; dlP.then(x=>{dl=x});
async function saveFile(blob,filename){
  if(dl){
    try{await dl.save({filename,data:blob});toast("PDF klar: "+filename);return}
    catch(e){const c=e&&e.code;if(c==="declined"){toast("Avbrutt");return}if(c==="rate_limited"){toast("Vent litt og prøv igjen");return}if(c==="too_large"||c==="bad_request"){toast("Kunne ikke lagre filen");return}}
  }
  try{const file=new File([blob],filename,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);toast("PDF lastet ned")}
  catch(e){toast("Kunne ikke lagre filen her")}
}
async function exportPdf(p){
  let blob;
  try{blob=makePdf(p)}catch(e){toast(e.message==="nolib"?"PDF-verktøyet er ikke lastet. Koble til nett og prøv igjen.":"Kunne ikke lage PDF");console.error(e);return}
  await saveFile(blob,`Skogskort_${slug(p.hund.navn)}_${p.hund.dato||localDate()}.pdf`);
}
let toastT;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}

// ---- handlinger ----
let delArm=false;
function go(screen){view={screen,id:null,tab:"tid",back:"home"};render();scrollTo(0,0)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.tab){view.tab=d.tab;render();scrollTo(0,0);return}
  if(d.go){go(d.go);return}
  if(d.open){const p=db.prover.find(x=>x.id===d.open);const back=view.screen==="done"||view.screen==="appr"?view.screen:"home";view={screen:"prove",id:d.open,tab:d.to||(p&&p.status!=="pagar"?"res":"tid"),back};render();scrollTo(0,0);return}
  if(d.pdf){const p=db.prover.find(x=>x.id===d.pdf);if(p)exportPdf(p);return}
  if(d.doc!==undefined){const D=DOCS[+d.doc];fetch(D.f).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(bl=>saveFile(bl,D.f.split("/").pop())).catch(()=>toast("Fant ikke dokumentet"));return}
  if(d.act==="back"){go(view.screen==="prove"?view.back:"home");return}
  if(d.act==="cleardemo"){if(!delArm){delArm=true;b.textContent="Trykk igjen for å fjerne eksemplene";setTimeout(()=>{delArm=false;if(b.isConnected)b.textContent="Fjern eksempelprøvene"},3000);return}delArm=false;db.prover=db.prover.filter(x=>!x.demo);save();render();toast("Eksempelprøvene er fjernet");return}
  if(d.act==="new"){const n=blank();db.prover.unshift(n);save();view={screen:"prove",id:n.id,tab:"hund",back:"home"};render();scrollTo(0,0);return}
  const p=cur(); if(!p) return;
  if(d.act==="pdf"){exportPdf(p);return}
  if(d.act==="del"){if(!delArm){delArm=true;b.textContent="Trykk igjen for å slette";setTimeout(()=>{delArm=false;if(b.isConnected)b.textContent="Slett prøven"},3000);return}delArm=false;db.prover=db.prover.filter(x=>x!==p);save();go(view.back||"home");return}
  if(d.act==="done"){p.status="gjennomfort";p.doneAt=Date.now();const f=forslag(p);p.kolleg={ep:Object.fromEntries(MOM.map(m=>[m.n,p.mom[m.n]?.ep||0])),g:f.g,merknad:p.kolleg?.merknad||""};save();render();toast("Flyttet til Gjennomførte prøver");return}
  if(d.act==="reopen"){p.status="pagar";save();render();toast("Prøven er åpnet igjen");return}
  if(d.act==="approve"){p.status="godkjent";p.apprAt=Date.now();save();render();toast("Lagt i Godkjent av dommerkollegiet");return}
  if(d.act==="unapprove"){p.status="gjennomfort";delete p.apprAt;save();render();return}
  if(d.kpr!==undefined&&p.kolleg){p.kolleg.g=+d.kpr;save();render();return}
  if(locked(p)) return;
  if(d.act==="sett"){p.sett=!p.sett}
  if(d.set){const[o,k]=d.set.split(".");p.hund[k]=p.hund[k]===d.v?"":d.v}
  if(d.tog){const a=p.forhold.terreng,i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1)}
  if(d.dyr!==undefined){p.slipp[+d.dyr].dyr=d.v}
  if(d.ep){const m=p.mom[d.ep]||(p.mom[d.ep]={ep:0,k:[]});m.ep=m.ep===+d.v?0:+d.v}
  if(d.kode){const m=p.mom[d.kode]||(p.mom[d.kode]={ep:0,k:[]});const v=+d.v,i=m.k.indexOf(v);i<0?m.k.push(v):m.k.splice(i,1);m.k.sort((a,b)=>a-b)}
  if(d.ev){
    const t=p.demo?(p.demoNow=(p.demoNow||Date.now())+MIN*2):Math.floor(Date.now()/MIN)*MIN;
    let s=p.slipp[p.slipp.length-1];
    if(d.ev==="slipp"){p.slipp.push({dyr:"Ukjent",ev:{slipp:t},tap:[]})}
    else if(d.ev==="tap"){s.tap.push({s:t})}
    else if(d.ev==="los"){s.tap.find(x=>!x.e).e=t}
    else{s.tap.forEach(x=>{if(!x.e)x.e=t}); if(d.ev==="koplet"&&s.ev.uttak&&!s.ev.opph)s.ev.opph=t; s.ev[d.ev]=t;
      if(d.ev==="opph")toast("Forflytning med koblet hund regnes ikke med i løstiden")}
  }
  if(d.act==="undo"){
    const s=p.slipp[p.slipp.length-1]; if(!s) return;
    const items=[...Object.entries(s.ev).map(([k,v])=>({k,v})),...s.tap.flatMap((x,j)=>[{k:"ts"+j,v:x.s},...(x.e?[{k:"te"+j,v:x.e}]:[])])].sort((a,b)=>b.v-a.v);
    const last=items[0];
    if(last.k==="slipp"&&Object.keys(s.ev).length===1&&!s.tap.length) p.slipp.pop();
    else if(last.k.startsWith("ts")) s.tap.splice(+last.k.slice(2),1);
    else if(last.k.startsWith("te")) delete s.tap[+last.k.slice(2)].e;
    else delete s.ev[last.k];
  }
  save();render();
});
document.addEventListener("change",e=>{
  const el=e.target,p=cur(); if(!p) return;
  if(el.dataset.kep&&p.kolleg){p.kolleg.ep[el.dataset.kep]=+el.value;save();render();return}
  if(locked(p)) return;
  if(el.dataset.chk){const[o,k]=el.dataset.chk.split(".");p.hund[k]=el.checked;save();return}
  if(el.dataset.time){
    const[i,k]=el.dataset.time.split("|"),s=p.slipp[+i]; if(!el.value) return;
    const[h,m]=el.value.split(":").map(Number);
    const set=old=>{const d=new Date(old);d.setHours(h,m,0,0);return d.getTime()};
    if(k.startsWith("ts")) s.tap[+k.slice(2)].s=set(s.tap[+k.slice(2)].s);
    else if(k.startsWith("te")) s.tap[+k.slice(2)].e=set(s.tap[+k.slice(2)].e);
    else s.ev[k]=set(s.ev[k]);
    save();render();
  }
});
document.addEventListener("input",e=>{
  const el=e.target,p=cur(); if(!p) return;
  if(el.dataset.f){const[o,k]=el.dataset.f.split(".");
    if(o==="k"){if(p.kolleg){p.kolleg[k]=el.value;save()}return}
    if(locked(p)) return;
    (o==="h"?p.hund:p.forhold)[k]=el.value;save();
    if(el.dataset.rr){render();return}
    if(o==="f"&&(k==="temp"||k==="sno")){const pos=el.selectionStart;render();const n=document.getElementById(el.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}}
  if(el.dataset.forlop!==undefined&&!locked(p)){p.forlop=el.value;save()}
});
setInterval(()=>{const p=cur();if(view.screen==="prove"&&view.tab==="tid"&&p&&!p.demo&&p.status==="pagar"&&p.slipp.length&&!document.activeElement?.matches("input,select,textarea"))render()},15000);
let wl;async function wake(){try{if(wl&&!wl.released)return;wl=await navigator.wakeLock?.request("screen")}catch(e){}}
document.addEventListener("click",wake);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
render();
</script>
